record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["stor_id","ord_num","title_id"]
columns:
  "stor_id":
    type: string
    required: true
  "ord_num":
    type: string
    required: true
  "ord_date":
    type: string
    required: true
  "qty":
    type: int
    required: true
  "payterms":
    type: string
    required: true
  "title_id":
    type: string
    required: true

record_file:
  name: records.json
  format: json
  type: "map[$record_id]map[$field_name]any"
primary_key: ["title_id"]
columns:
  "title_id":
    type: string
    required: true
  "title":
    type: string
    required: true
  "type":
    type: string
    required: true
  "pub_id":
    type: string
  "price":
    type: any
  "advance":
    type: int
  "royalty":
    type: int
  "ytd_sales":
    type: int
  "notes":
    type: string
  "pubdate":
    type: string
    required: true

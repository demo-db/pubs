- name: titleview
  columns:
    - title
    - au_ord
    - au_lname
    - price
    - ytd_sales
    - pub_id
  createsql: CREATE VIEW titleview AS select title, au_ord, au_lname, price, ytd_sales, pub_id from authors, titles, titleauthor where authors.au_id = titleauthor.au_id AND titles.title_id = titleauthor.title_id
